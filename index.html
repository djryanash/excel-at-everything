<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel at Everything — Test Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #eaeaea;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e94560, #ffb703);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0.75rem 0; color: #b8c1ec; font-size: 1.1rem; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid #e94560;
      border-radius: 999px;
      font-size: 0.9rem;
      color: #e94560;
    }
    footer { margin-top: 2rem; font-size: 0.85rem; color: #6c757d; }
  </style>
</head>
<body>
  <main>
    <h1>Excel at Everything</h1>
    <p>✅ Simple test website — deployed successfully.</p>
    <p>If you can read this, the pipeline works end to end.</p>
    <span class="badge">test build</span>
    <footer>Built and pushed from a pi coding agent session</footer>
  </main>
</body>
</html>
